<svg width="680" height="130" viewBox="0 0 680 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hzShieldBg" x1="60" y1="12" x2="60" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#002B49" />
      <stop offset="100%" stop-color="#00172D" />
    </linearGradient>
    <linearGradient id="hzShieldBorder" x1="20" y1="15" x2="100" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <linearGradient id="hzTextBrand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0077B6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- === EMBLEM ICON (LEFT) === -->
  <g transform="translate(10, 5)">
    <!-- Outer Shield -->
    <path d="M60 12C85 12 105 24 105 46C105 80 78 108 60 118C42 108 15 80 15 46C15 24 35 12 60 12Z" 
          fill="url(#hzShieldBg)" 
          stroke="url(#hzShieldBorder)" 
          stroke-width="3" 
          filter="url(#hzGlow)" />

    <!-- Connecting Grid Lines -->
    <line x1="60" y1="36" x2="40" y2="60" stroke="#90E0EF" stroke-width="1.8" opacity="0.9" />
    <line x1="60" y1="36" x2="80" y2="60" stroke="#90E0EF" stroke-width="1.8" opacity="0.9" />
    <line x1="40" y1="60" x2="60" y2="82" stroke="#90E0EF" stroke-width="1.8" opacity="0.9" />
    <line x1="80" y1="60" x2="60" y2="82" stroke="#90E0EF" stroke-width="1.8" opacity="0.9" />
    <line x1="60" y1="36" x2="60" y2="82" stroke="#00B4D8" stroke-width="1.8" stroke-dasharray="3 2" />

    <!-- Core Nodes -->
    <circle cx="60" cy="36" r="6" fill="#00B4D8" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="40" cy="60" r="5" fill="#34D399" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="80" cy="60" r="5" fill="#FBBF24" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="60" cy="82" r="5.5" fill="#0096C7" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="60" cy="100" r="3" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
    
    <!-- Top Sparkle -->
    <path d="M60 14L61.5 19L66 20.5L61.5 22L60 27L58.5 22L54 20.5L58.5 19Z" fill="#FBBF24" />
  </g>

  <!-- === TYPOGRAPHY (RIGHT) === -->
  <!-- Main Brand Title -->
  <text x="145" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#002244">Gov</tspan><tspan fill="url(#hzTextBrand)">DataHub</tspan>
  </text>

  <!-- Official Badge Pill -->
  <rect x="420" y="38" width="96" height="22" rx="4" fill="#E0F2FE" />
  <text x="468" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#0369A1" text-anchor="middle" letter-spacing="1">
    ENTERPRISE
  </text>

  <!-- Tagline / Subtitle -->
  <text x="146" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.8">
    SISTEM INFORMASI &amp; MANAJEMEN DATA TERPADU
  </text>

  <!-- Standard Data Indicator Line -->
  <text x="146" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#0284C7" letter-spacing="0.5">
    Platform Satu Data Pemerintahan Daerah Berbasis Geospasial
  </text>
</svg>
